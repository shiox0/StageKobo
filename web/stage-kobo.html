<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>すてーじ工房 — Idol Stage Kit</title>
<style>
:root{
  --bg:#0b0d1a; --panel:#11142a; --panel2:#171b36; --line:#262b52; --text:#e9ecff; --dim:#9aa3d6;
  --mint:#7ff5d6; --pink:#ff8fd0; --sky:#8fd3ff; --warn:#ffcf6b; --danger:#ff6b8a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI","Meiryo",system-ui,sans-serif;font-size:13px;overflow:hidden}
#app{display:flex;height:100vh;width:100vw}
#panel{width:350px;min-width:350px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:5}
#panel header{padding:12px 14px 8px;border-bottom:1px solid var(--line)}
#panel header h1{margin:0;font-size:17px;letter-spacing:.06em}
#panel header h1 span{background:linear-gradient(90deg,var(--mint),var(--sky),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
#panel header small{color:var(--dim);font-size:11px}
#tabs{display:flex;flex-wrap:wrap;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line)}
#tabs button{flex:1 1 30%;background:var(--panel2);color:var(--dim);border:1px solid var(--line);border-radius:8px;padding:6px 4px;font-size:12px;cursor:pointer;font-family:inherit}
#tabs button.on{background:linear-gradient(135deg,#2b2f63,#3a2a5c);color:#fff;border-color:#5a5fb0}
#tabBody{flex:1;overflow-y:auto;padding:8px 10px 40px}
#tabBody::-webkit-scrollbar{width:8px}#tabBody::-webkit-scrollbar-thumb{background:#2d335f;border-radius:4px}
details.sec{background:var(--panel2);border:1px solid var(--line);border-radius:10px;margin:0 0 8px;overflow:hidden}
details.sec>summary{padding:8px 10px;cursor:pointer;font-weight:bold;font-size:12.5px;list-style:none;display:flex;align-items:center;gap:6px}
details.sec>summary::before{content:"▸";color:var(--mint);transition:transform .15s}
details.sec[open]>summary::before{transform:rotate(90deg)}
details.sec>.body{padding:4px 10px 10px}
.row{display:flex;align-items:center;gap:6px;margin:5px 0;min-height:24px}
.row>label{flex:0 0 96px;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row input[type=range]{flex:1;accent-color:var(--mint);min-width:0}
.row input[type=number]{width:58px;background:#0c0f20;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:2px 4px;font-family:inherit;font-size:12px}
.row input[type=text]{flex:1;background:#0c0f20;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-family:inherit}
.row select{flex:1;background:#0c0f20;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:3px 4px;font-family:inherit;font-size:12px;min-width:0}
.row input[type=color]{width:44px;height:24px;border:1px solid var(--line);border-radius:6px;background:none;padding:0;cursor:pointer}
.row .hex{color:var(--dim);font-size:11px;font-family:monospace}
.row input[type=checkbox]{accent-color:var(--pink);width:16px;height:16px}
.btn{background:#222754;color:var(--text);border:1px solid #3a4084;border-radius:8px;padding:5px 9px;cursor:pointer;font-family:inherit;font-size:12px;white-space:nowrap}
.btn:hover{background:#2c3270;border-color:var(--mint)}
.btn.pri{background:linear-gradient(135deg,#2bb59a,#3a7bd5);border-color:#5ee0c4;color:#fff}
.btn.pink{background:linear-gradient(135deg,#d0559f,#8a4bd6);border-color:#ff9fd8;color:#fff}
.btn.danger{background:#4a1f30;border-color:#8a3150}
.btn.on{outline:2px solid var(--mint);outline-offset:1px}
.btn.sm{padding:3px 7px;font-size:11px}
.btns{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.note{color:var(--dim);font-size:11px;line-height:1.55;margin:4px 0 6px}
.note b{color:var(--mint);font-weight:normal}
.palette{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.palette .btn{text-align:left;overflow:hidden;text-overflow:ellipsis}
.catTitle{color:var(--pink);font-size:11px;margin:8px 0 4px;letter-spacing:.08em}
.list{max-height:230px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;background:#0c0f20}
.list .item{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid #1b1f3d;cursor:pointer}
.list .item:hover{background:#171c3c}
.list .item.sel{background:#253064}
.list .item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .item .tag{font-size:10px;color:var(--dim)}
.list .item .eye{opacity:.8;font-size:11px;color:var(--mint)}
.list .item .eye.off{color:#555}
.cue{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid #1b1f3d;cursor:pointer}
.cue.on{background:linear-gradient(90deg,#2a3576,#3d2a6a)}
.cue .no{color:var(--mint);font-family:monospace;width:18px}
.xyz{display:flex;gap:4px;flex:1}
.xyz input{width:100%!important}
#view{flex:1;position:relative;overflow:hidden}
#view canvas{display:block}
.hud{position:absolute;display:flex;gap:5px;align-items:center;flex-wrap:wrap;z-index:3}
#topbar{top:10px;left:10px;right:10px}
#topbar .grp{display:flex;gap:4px;background:rgba(12,14,30,.72);border:1px solid var(--line);border-radius:10px;padding:4px;backdrop-filter:blur(6px)}
#topbar .sp{flex:1}
/* リモコン */
#remote{position:absolute;z-index:4;width:300px;max-height:calc(100% - 60px);display:flex;flex-direction:column;background:rgba(14,16,36,.88);border:1px solid #39407a;border-radius:16px;backdrop-filter:blur(8px);box-shadow:0 10px 34px rgba(0,0,0,.5);user-select:none}
#remote .rmHead{display:flex;align-items:center;gap:4px;padding:7px 8px;border-bottom:1px solid #2a2f5c;cursor:grab;flex-wrap:wrap;touch-action:none}
#remote.min .rmHead{border-bottom:none}
#remote.min .rmBody{display:none}
#remote .rmGrip{color:#6c74b8;font-size:13px}
#remote .rmTitle{font-size:11px;letter-spacing:.22em;color:var(--mint);font-weight:bold;margin-right:4px}
#remote .rmSep{width:1px;height:18px;background:#343a6e;margin:0 2px}
#remote .rmFill{flex:1}
#remote .bpm{font-family:monospace;font-size:15px;width:34px;text-align:center;color:var(--mint)}
#remote .beat{width:10px;height:10px;border-radius:50%;background:#333;transition:background .05s}
#remote .beat.on{background:var(--pink);box-shadow:0 0 8px var(--pink)}
#remote .rmBody{padding:6px 8px 8px;overflow-y:auto}
#remote .rmBody::-webkit-scrollbar{width:6px}#remote .rmBody::-webkit-scrollbar-thumb{background:#2d335f;border-radius:3px}
#remote .rmScenes{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:6px}
#remote .rmLbl{font-size:10.5px;color:var(--pink);letter-spacing:.12em;flex-basis:100%}
#remote .rmLbl2{font-size:10.5px;color:var(--dim);margin-right:2px}
#remote .rmGrid{display:flex;flex-direction:column;gap:5px}
#remote .rmSec{background:rgba(255,255,255,.03);border:1px solid #262b55;border-radius:10px;padding:5px 6px 6px}
#remote .rmSecT{font-size:10.5px;color:var(--pink);letter-spacing:.14em;margin-bottom:4px}
#remote .rmBtns{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
#remote .rmBreak{flex-basis:100%;height:1px}
.rb{background:#1f2450;color:#dfe3ff;border:1px solid #363d7c;border-radius:7px;padding:4px 7px;font-size:11.5px;font-family:inherit;cursor:pointer;white-space:nowrap;line-height:1.25;transition:background .12s,box-shadow .12s}
.rb:hover{border-color:var(--mint)}
.rb:active{transform:scale(.95)}
.rb.on{background:linear-gradient(135deg,#2fbf9f,#4a7fe0);color:#fff;border-color:#8ff5dd;box-shadow:0 0 10px rgba(127,245,214,.5)}
.rb.warn.on{background:linear-gradient(135deg,#d0405f,#7a2040);border-color:#ff8fa8;box-shadow:0 0 10px rgba(255,90,120,.6)}
.rb.fx{background:linear-gradient(135deg,#9a3f86,#5d3aa0);border-color:#d68fd8}
.rb.sw{width:29px;height:22px;padding:0;border-radius:6px}
.rb.sw.on{outline:2px solid #fff;outline-offset:1px;box-shadow:0 0 10px rgba(255,255,255,.6)}
.rb.play{min-width:30px}
.rb.sm{padding:4px 6px}
.rb.scene{max-width:88px;overflow:hidden;text-overflow:ellipsis}
.rb.scene.last:not(.on){border-color:var(--mint);color:var(--mint)}
.rb.add{border-style:dashed;color:var(--dim)}
.rb.min{font-size:10.5px;color:var(--dim)}
#pipLabel{position:absolute;left:14px;z-index:3;font-size:11px;color:#fff;background:rgba(220,40,80,.85);padding:2px 7px;border-radius:5px;pointer-events:none}
#status{position:absolute;top:52px;left:50%;transform:translateX(-50%);background:rgba(20,24,52,.9);border:1px solid var(--mint);border-radius:8px;padding:6px 14px;opacity:0;transition:opacity .3s;z-index:4;pointer-events:none}
#status.show{opacity:1}
#hint{position:absolute;left:12px;top:52px;color:#aab3e6;font-size:11px;background:rgba(12,14,30,.6);padding:6px 9px;border-radius:8px;line-height:1.6;z-index:2;pointer-events:none}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--mint);background:var(--bg);z-index:10}
/* VJ リモコン（プレビュー部分は透明にして WebGL で描くので backdrop-filter は使わない） */
#vjRemote{position:absolute;z-index:4;width:780px;max-width:calc(100% - 12px);max-height:calc(100% - 62px);display:flex;flex-direction:column;border:1px solid #7a4aa8;border-radius:16px;box-shadow:0 10px 34px rgba(0,0,0,.55);user-select:none}
#vjRemote .vjHead{display:flex;align-items:center;gap:4px;padding:7px 8px;background:rgba(30,14,46,.96);border-radius:15px 15px 0 0;cursor:grab;flex-wrap:wrap;touch-action:none;border-bottom:1px solid #4a2d6e}
#vjRemote.min .vjHead{border-radius:15px;border-bottom:none}
#vjRemote.min .vjMain{display:none}
#vjRemote .vjMain{display:grid;grid-template-columns:minmax(0,1fr) 300px minmax(0,1fr);flex:1 1 auto;min-height:0;background:rgba(20,11,34,.96);border-radius:0 0 15px 15px}
#vjRemote .vjCol{display:flex;flex-direction:column;gap:5px;padding:6px 7px 8px;overflow-y:auto;min-height:0}
#vjRemote .vjCol::-webkit-scrollbar{width:6px}#vjRemote .vjCol::-webkit-scrollbar-thumb{background:#45306a;border-radius:3px}
#vjRemote .vjL{background:rgba(70,140,255,.06)}#vjRemote .vjR{background:rgba(255,110,200,.06);border-radius:0 0 15px 0}#vjRemote .vjL{border-radius:0 0 0 15px}
#vjRemote .vjC{padding:0 0 8px;border-left:1px solid #4a2d6e;border-right:1px solid #4a2d6e}
#vjRemote .vjC>.rmSec,#vjRemote .vjC>.vjPads,#vjRemote .vjC>.vjInfo{margin:0 7px}
#vjRemote .vjDeckT{font-size:12px;font-weight:bold;letter-spacing:.08em}#vjRemote .vjDeckT.a{color:#8fd1ff}#vjRemote .vjDeckT.b{color:#ff9fdc}
#vjRemote .vjInfo{font-size:11.5px;line-height:1.5;background:rgba(0,0,0,.35);border:1px solid #33275a;border-radius:8px;padding:5px 7px;white-space:pre-line;color:#e7e3ff}
#vjRemote .vjInfo small{color:var(--dim);font-size:10.5px}
#vjRemote .vjInfo.shown{border-color:var(--mint);box-shadow:0 0 8px rgba(127,245,214,.35)}
#vjRemote .vjInfo.c{font-size:11px;margin-top:6px}
#vjRemote .rb.tab{font-size:11px}
#vjRemote .rb.gen.a:not(.on){background:#1b2c55}#vjRemote .rb.gen.b:not(.on){background:#4a1f45}
#vjRemote .rb.deckA:not(.on){background:#1b2c55}#vjRemote .rb.deckB:not(.on){background:#4a1f45}
#vjRemote .vjTitle{font-size:12px;letter-spacing:.22em;color:var(--pink);font-weight:bold;margin-right:2px}
#vjRemote .rmSep{width:1px;height:18px;background:#4a3470;margin:0 2px}
#vjRemote .rmFill{flex:1}
#vjRemote .bpm{font-family:monospace;font-size:14px;width:30px;text-align:center;color:var(--mint)}
#vjRemote .beat{width:10px;height:10px;border-radius:50%;background:#333}
#vjRemote .beat.on{background:var(--pink);box-shadow:0 0 8px var(--pink)}
#vjRemote .vjPrev{position:relative;flex:0 0 auto;aspect-ratio:16/9;background:transparent;cursor:zoom-in;border-left:1px solid #4a2d6e;border-right:1px solid #4a2d6e}
#vjRemote .vjPrevLbl{position:absolute;left:6px;bottom:5px;max-width:calc(100% - 12px);font-size:10px;line-height:1.35;color:#fff;background:rgba(10,6,20,.62);padding:2px 6px;border-radius:6px;pointer-events:none}
#vjRemote .vjPrevLbl:empty{display:none}
#vjRemote .vjPrevLbl.warn{color:#ff9fb4}
#vjRemote .vjBody{padding:6px 8px 8px;overflow-y:auto;background:rgba(20,11,34,.96);border-radius:0 0 15px 15px;display:flex;flex-direction:column;gap:5px;min-height:0}
#vjRemote .vjBody::-webkit-scrollbar{width:6px}#vjRemote .vjBody::-webkit-scrollbar-thumb{background:#45306a;border-radius:3px}
#vjRemote .rmSec{background:rgba(255,255,255,.035);border:1px solid #33275a;border-radius:10px;padding:5px 6px 6px}
#vjRemote .rmSecT{font-size:10.5px;color:var(--pink);letter-spacing:.12em;margin-bottom:4px}
#vjRemote .rmBtns{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
#vjRemote .rmBreak{flex-basis:100%;height:1px}
#vjRemote .rmLbl2{font-size:10.5px;color:var(--dim);margin-right:2px}
#vjRemote .vjPads{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:5px}
#vjRemote .rb.pad{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px 5px;font-size:11px;background:linear-gradient(160deg,#3a2466,#20163f);border-color:#6a4aa8;border-radius:9px;touch-action:none}
#vjRemote .rb.pad small{font-size:9.5px;color:#b9a6ea;font-family:monospace}
#vjRemote .rb.pad.hit{background:linear-gradient(160deg,#ff8fd0,#8f6bff);color:#fff;box-shadow:0 0 14px rgba(255,143,208,.8)}
#vjRemote .rb.deck{flex:0 0 92px;text-align:left;overflow:hidden;text-overflow:ellipsis;padding:6px 7px}
#vjRemote .rb.deck b{color:var(--pink)}
#vjRemote .rb.deck.on b{color:#fff}
#vjRemote .vjXf{flex:1;min-width:60px;accent-color:var(--pink)}
#vjRemote .rb.gen{min-width:46px;padding:4px 5px}
#vjRemote .rb.gen.old:not(.on){border-color:#5a3f7c;color:#e8d8ff}
#vjRemote .rb.fxt:not(.on){background:#2a1d4c}
#vjRemote .rb.out{font-size:11px}
#vjRemote .rb.preset{background:linear-gradient(135deg,#3a2466,#253064)}
#vjRemote .rb.scene{max-width:120px;overflow:hidden;text-overflow:ellipsis}
#vjRemote .vjVal{font-family:monospace;font-size:11.5px;min-width:30px;text-align:center;color:var(--mint)}
#vjRemote .vjText{flex:1;min-width:120px;background:#0c0f20;color:var(--text);border:1px solid #4a3470;border-radius:6px;padding:4px 6px;font-family:inherit}
#vjRemote .vjThumb{position:relative;width:52px;height:30px;padding:0;border:1px solid #4a3470;border-radius:5px;overflow:hidden;background:#000;cursor:pointer}
#vjRemote .vjThumb img{width:100%;height:100%;object-fit:cover;display:block}
#vjRemote .vjThumb.on{outline:2px solid var(--mint);outline-offset:1px}
#vjRemote .vjThumb .x,#vjRemote .vjSlot .x{position:absolute;top:0;right:0;font-size:10px;line-height:1;padding:1px 3px;background:rgba(0,0,0,.7);color:#fff;border-radius:0 0 0 4px;cursor:pointer}
#vjRemote .vjSlot{position:relative;display:inline-flex}
#vjRemote .vjSlot .rb{padding-right:16px}
#vjRemote .note{margin:2px 0 0}
.rb.vjopen{background:linear-gradient(135deg,#7a3a9a,#3a3aa0);border-color:#d69fff}
body.vjOpen #hint{display:none}
/* VJ 出力モード（全画面） */
body.vjFull #panel,body.vjFull #topbar,body.vjFull #remote,body.vjFull #pipLabel,body.vjFull #hint{display:none!important}
body.vjFull #vjRemote .vjPrev{display:none}
body.vjFull #vjRemote .vjMain{border-top:1px solid #4a2d6e}
body.vjFull #vjRemote{opacity:.94}
body.vjHideUI #vjRemote{display:none}
body.vjFull.vjHideUI #view{cursor:none}
body.vjFull.vjHideUI #status{display:none}
.hide{display:none!important}
</style>

<body>
<div id="app">
  <aside id="panel">
    <header>
      <h1><span>すてーじ工房</span></h1>
      <small>Idol Stage Kit — three.js / VRChat移植を見据えた設計</small>
    </header>
    <nav id="tabs"></nav>
    <div id="tabBody"></div>
  </aside>
  <main id="view">
    <div id="loading">読み込み中…（three.js をCDNから取得しています）</div>
    <div class="hud" id="topbar">
      <div class="grp" id="viewBtns"></div>
      <div class="grp" id="gizmoBtns"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
   すてーじ工房 (Idol Stage Kit)
   ---------------------------------------------------------------------
   設計メモ（VRChat移植を見据えて）
   - すべての見た目は state(JSON) から再構築できる。state 以外に「正」は持たない。
   - 単位はメートル。Y上、+Z = 客席側。ステージ前縁 = z:+depth/2。
   - アセットは { type, pos, rot, scale, color, p(固有パラメータ), mirror, arr } の共通形式。
     mirror = X=0 を軸に左右対称コピー、arr = X方向に等間隔で並べる。
   - ライトの動きは「時間(拍) → 向き/色/明るさ」の純関数（PATTERNS / colorAt / dimAt）。
     Udon / Animator に同じ式を移植すれば同じ演出になる。
   - LEDモニター = カメラ → RenderTexture → ドットシェーダー（VRCでもそのまま同構成が可能）。
   ===================================================================== */

const APP_VERSION = '0.10.0';
const DEG = Math.PI / 180;
const TAU = Math.PI * 2;
const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const fract = x => x - Math.floor(x);
const uid = (p = 'a') => p + '_' + Math.random().toString(36).slice(2, 8);
const col = (hex, s = 1) => new THREE.Color(hex).multiplyScalar(s);
const deepClone = o => JSON.parse(JSON.stringify(o));
function deepMerge(base, over) {
  if (over === undefined) return deepClone(base);
  if (base === null || typeof base !== 'object' || Array.isArray(base)) return deepClone(over);
  if (over === null || typeof over !== 'object' || Array.isArray(over)) return deepClone(over);
  const out = {};
  for (const k of Object.keys(base)) out[k] = deepMerge(base[k], over[k]);
  for (const k of Object.keys(over)) if (!(k in base)) out[k] = deepClone(over[k]);

function disposeTree(obj) {
  obj.traverse(o => {
    if (o.geometry && !o.geometry.userData.shared) o.geometry.dispose();
    if (o.userData.exportGeo) o.userData.exportGeo.dispose();
    if (o.material) {
      const ms = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of ms) if (!m.userData.shared) m.dispose();
    }
  });
}
function clearGroup(g) {
  for (const c of [...g.children]) { g.remove(c); disposeTree(c); }
}

const BEAM_VS = /* glsl */`

  vN = normalize(normalMatrix * normal);
  vV = normalize(-mv.xyz);
  vWP = (modelMatrix * vec4(position,1.0)).xyz;
  gl_Position = projectionMatrix * mv;
}`;
const BEAM_FS = /* glsl */`
uniform vec3 uColor; uniform float uInt; uniform float uLen; uniform float uHaze; uniform float uEndFade; uniform float uTime;
varying float vY; varying vec3 vN; varying vec3 vV; varying vec3 vWP;
float h3(vec3 p){ return fract(sin(dot(p, vec3(12.9898,78.233,37.719)))*43758.5453); }
void main(){
  float d = vY * uLen;
  float along = exp(-d * 0.05) * smoothstep(0.0, 0.35, d);
  along *= mix(1.0, 1.0 - smoothstep(0.75, 1.0, vY), uEndFade);
  float edge = pow(abs(dot(normalize(vN), normalize(vV))), 1.6);
  float camFade = smoothstep(0.6, 5.0, length(vWP - cameraPosition));
  float dust = 0.85 + 0.15 * sin(vWP.y * 3.0 + uTime * 0.7 + vWP.x * 2.0);
  float a = uInt * uHaze * along * edge * camFade * dust * 0.28;

/* 生成したテクスチャ一式（同じ質感・同じ引数なら使い回す → GLB にも1枚だけ入る） */
const SURF_CACHE = new Map();
const SURF_STATS = { count: 0, ms: 0 };
function surfaceTextures(name, args = null) {
  const def = SURFACES[name]; if (!def) return null;
  const key = name + (args ? '|' + JSON.stringify(args) : '');
  if (SURF_CACHE.has(key)) return SURF_CACHE.get(key);
  const t0 = performance.now();
  // 引数つき（色を含む床など）は色を変えるたびに増えるので、同じ質感の古いものは 3 つまで残して片付ける
  if (args) { const old = [...SURF_CACHE.keys()].filter(k => k.startsWith(name + '|')); while (old.length >= 3) { const k = old.shift(); const o = SURF_CACHE.get(k); for (const t of [o.map, o.normalMap, o.orm]) t.dispose(); SURF_CACHE.delete(k); } }
  const N = def.size; const r = def.gen(N, args || {});
  const h = r.h, ns = 2.0;
  // AO：まわりより低いところ（溝・穴）を暗く
  const bl = tblur(h, N, Math.max(2, Math.round(N / 96)));
  const mk = (fill) => { const cv = document.createElement('canvas'); cv.width = cv.height = N; const g = cv.getContext('2d'); const im = g.createImageData(N, N); fill(im.data); g.putImageData(im, 0, 0); return cv; };
  const albCv = mk(d => {
    for (let i = 0; i < N * N; i++) {
      if (r.rgb) { d[i * 4] = r.rgb[i * 3] * 255; d[i * 4 + 1] = r.rgb[i * 3 + 1] * 255; d[i * 4 + 2] = r.rgb[i * 3 + 2] * 255; }
      else { const v = Math.max(0, Math.min(1, r.alb[i])) * 255; d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = v; }
      d[i * 4 + 3] = 255;
    }
  });
  const nrmCv = mk(d => {
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const i = y * N + x; let nx, ny;
      if (r.nx) { nx = r.nx[i]; ny = r.ny[i]; }
      else {
        nx = -(h[y * N + (x + 1) % N] - h[y * N + (x - 1 + N) % N]) * ns;
        ny = (h[((y + 1) % N) * N + x] - h[((y - 1 + N) % N) * N + x]) * ns;   // 緑 = 画像の上向き（glTF の決まり）
      }
      const L = Math.hypot(nx, ny, 1);
      d[i * 4] = (nx / L * 0.5 + 0.5) * 255; d[i * 4 + 1] = (ny / L * 0.5 + 0.5) * 255; d[i * 4 + 2] = (1 / L * 0.5 + 0.5) * 255; d[i * 4 + 3] = 255;
    }
  });
  const aoK = 3.5 * (r.ao ?? 1);
  const ormCv = mk(d => {
    for (let i = 0; i < N * N; i++) {
      const ao = Math.max(0.35, Math.min(1, 1 - aoK * Math.max(0, bl[i] - h[i])));
      d[i * 4] = ao * 255; d[i * 4 + 1] = Math.max(0.02, Math.min(1, r.rough[i])) * 255; d[i * 4 + 2] = 255; d[i * 4 + 3] = 255;
    }
  });
  const tex = (cv, srgb) => {
    const t = new THREE.CanvasTexture(cv); t.flipY = false; t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace; t.anisotropy = 8; t.userData.shared = true;
    t.userData.mimeType = 'image/jpeg';   // GLB を軽くする（模様は細かいノイズなので JPEG で十分）
    return t;
  };
  const out = { map: tex(albCv, true), normalMap: tex(nrmCv, false), orm: tex(ormCv, false), def };
  SURF_CACHE.set(key, out);
  SURF_STATS.count++; SURF_STATS.ms += performance.now() - t0;
  (SURF_STATS.each || (SURF_STATS.each = {}))[name] = Math.round(performance.now() - t0);
  return out;
}
/* マテリアルに質感を付ける。o.tile：1枚のメートル（省略時は質感の既定）、o.ns：ノーマルの強さ、o.args：色などの引数 */
function applySurface(m, name, o = {}) {
  const S = surfaceTextures(name, o.args); if (!S) return m;

  m.normalMap = S.normalMap; const k = (o.ns ?? 1) * S.def.ns; m.normalScale.set(k, -k);

  m.userData.surf = name; m.userData.surfTile = o.tile ?? S.def.tile;
  m.needsUpdate = true;

}

/* ---------- UV を「メートル ÷ tile」に合わせる ----------

/* ---------- 視点 ---------- */
function tweenView(pos, target) { VIEW.mode = 'free'; orbit.enabled = true; VIEW.tween = { p0: camera.position.clone(), t0: orbit.target.clone(), p1: pos, t1: target, k: 0 }; updateViewBtns(); }
function setView(key) {
  const st = S.stage, H = st.height, D = st.depth;
  if (key === 'cam1' || key === 'cam2') { VIEW.mode = key; orbit.enabled = false; tcontrols.detach(); updateViewBtns(); return; }
  if (VIEW.mode !== 'free') { const sc = SCAMS[VIEW.mode === 'cam1' ? 0 : 1]; orbit.target.copy(sc.pose.look); camera.fov = 42; camera.updateProjectionMatrix(); }
  VIEW.mode = 'free'; reattachGizmo();
  const V = {
    seat: [V3(0, 5.2, D / 2 + 21), V3(0, H + 2.5, 0)],
    front: [V3(0, H + 1.7, D / 2 + 8), V3(0, H + 2.2, 0)],
    top: [V3(0, 32, D / 2 + 18), V3(0, 0, 2)],
    side: [V3(-20, 8, D / 2 + 16), V3(0, H + 2, 0)],
    stage: [V3(0, H + 1.6, 0), V3(0, H + 1.4, D / 2 + 10)],
  }[key];
  if (V) tweenView(V[0], V[1]);
}
function updateViewTween(dt) {
  const tw = VIEW.tween; if (!tw) return;
  tw.k = Math.min(1, tw.k + dt / 0.6); const e = smooth(tw.k);
  camera.position.lerpVectors(tw.p0, tw.p1, e); orbit.target.lerpVectors(tw.t0, tw.t1, e);
  if (tw.k >= 1) VIEW.tween = null;
}

function bakeInstanced(im) {

  const crowd = im.userData.crowd;    // 客席の人：拍で弾む前の高さに戻して、UV.x に位相を入れる
  const P0 = V3(), Q0 = new THREE.Quaternion(), S0 = V3();

    }

    if (hasCol) { im.getColorAt(i, c); const n = g.attributes.position.count, arr = new Float32Array(n * 3); for (let k = 0; k < n; k++) { arr[k * 3] = c.r / maxC; arr[k * 3 + 1] = c.g / maxC; arr[k * 3 + 2] = c.b / maxC; } g.setAttribute('color', new THREE.BufferAttribute(arr, 3)); }

function exportGLB() {
  const roots = [G.stage, G.backdrop, G.assets]; if (EXPORT_OPTS.venue) roots.push(G.venue);
  const hidden = [], temps = [];
  const hide = o => { if (o.visible) { o.visible = false; hidden.push(o); } };
  if (!EXPORT_OPTS.crowd) for (const a of S.assets) if (a.type === 'audience' || a.type === 'chairs') { const rt = RT_ASSETS.get(a.id); if (rt) hide(rt.root); }
  for (const r of roots) r.traverse(o => { if (o.userData.fx) hide(o); if (o.isLight) hide(o); });
  for (const r of roots) r.traverse(o => { if (o.isInstancedMesh && visibleChain(o)) { const m = bakeInstanced(o); o.parent.add(m); temps.push(m); hide(o); } });
  // シェーダー（LED等）は GLB に入らないので、名前付きの仮マテリアルに差し替えて書き出す → Unity 側で差し替えやすくする

  toast('GLBを書き出しています…', 4000);
  try {
    new GLTFExporter().parse(roots, (res) => { restoreAll(); download(`${safeName()}.glb`, new Blob([res], { type: 'model/gltf-binary' })); toast('GLBを書き出しました'); },
      (err) => { restoreAll(); toast('GLB書き出しに失敗: ' + (err?.message || err)); }, { binary: true, onlyVisible: true });
  } catch (e) { restoreAll(); toast('GLB書き出しに失敗: ' + e.message); }
}

/* 画像を読み込む：大きい写真は縮める（GPU と自動保存の容量のため） */

  inp.onchange = async () => {
    const files = [...inp.files]; let n = 0;
    for (const f of files) {
      try {

        const img = await new Promise((ok, ng) => { const im = new Image(); im.onload = () => ok(im); im.onerror = ng; im.src = url; });
        const k = Math.min(1, 1280 / Math.max(img.width, img.height));

        const id = uid('img'); IMAGES[id] = /png|gif|webp/.test(f.type) ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg', 0.88);
        S.vj.images.push(id); n++;

/* ---------- 画質 ---------- */
const QUALITY_PRESETS = {
  low: { reflect: false, reflectScale: 0.35, pixelRatio: 1, camEvery: 2 },
  mid: { reflect: true, reflectScale: 0.5, pixelRatio: Math.min(devicePixelRatio, 1.25), camEvery: 1 },
  high: { reflect: true, reflectScale: 0.8, pixelRatio: Math.min(devicePixelRatio, 2), camEvery: 1 },

function applyQuality() {
  Object.assign(QUALITY, QUALITY_PRESETS[QUALITY.level] || QUALITY_PRESETS.mid);
  renderer.setPixelRatio(QUALITY.pixelRatio); composer.setPixelRatio(QUALITY.pixelRatio); onResize();
}
function onResize() {

  renderer.setSize(w, h); composer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
  placeRemote(); placeVJRemote();
}
new ResizeObserver(onResize).observe(viewEl);

/* ---------- ループ ---------- */
const clock = new THREE.Clock(); let lastBeatInt = -1; let beatDot = null;

    if (REG_DIRTY) refreshRegistry();

    updateLights(dt);
    vjFrame(dt);   // VJ 映像（必要なときだけ作る）→ LED モニター・背景 LED に貼る
    if (VJOUT.full) {
      // VJ 出力モード：ステージは描かず、VJ 映像だけを全画面に
      vjRenderFull();
      if (SHOT.req) { SHOT.req = false; const a = h('a', { href: renderer.domElement.toDataURL('image/png'), download: `${safeName()}_vj.png` }); a.click(); }
    } else {
      updateStageCams();
      updateViewTween(dt);
      if (VIEW.mode !== 'free') {
        const sc = SCAMS[VIEW.mode === 'cam1' ? 0 : 1];
        camera.position.copy(sc.cam.position); camera.quaternion.copy(sc.cam.quaternion); camera.fov = sc.cam.fov; camera.updateProjectionMatrix();
      } else orbit.update();
      renderStageCams();
      composer.render(dt);
      if (SHOT.req) { SHOT.req = false; const a = h('a', { href: renderer.domElement.toDataURL('image/png'), download: `${safeName()}.png` }); a.click(); toast('スクリーンショットを保存しました'); }
      renderPIP();
      renderVJPreview();
    }
    vjUITick();
  } catch (e) { console.error(e); if (!frame.err) { frame.err = true; toast('エラー: ' + e.message, 6000); } }
  if (!beatDot || !beatDot.isConnected) beatDot = $('#beatDot'); const bi = Math.floor(LT.beat); if (beatDot && bi !== lastBeatInt) { lastBeatInt = bi; beatDot.classList.add('on'); setTimeout(() => beatDot.classList.remove('on'), 90); }
}

function init() {
  try { const q = localStorage.getItem('stagekobo.quality'); if (q && QUALITY_PRESETS[q]) QUALITY.level = q; } catch (e) {}
  Object.assign(QUALITY, QUALITY_PRESETS[QUALITY.level]); renderer.setPixelRatio(QUALITY.pixelRatio); composer.setPixelRatio(QUALITY.pixelRatio);
  onResize();
  initStageCams(); buildHUD(); applySnap();
  const saved = loadLocal();
  if (saved && saved.state) {
    Object.assign(IMAGES, saved.images || {}); Object.assign(BLOBS, saved.blobs || {});
    S = normalizeState(saved.state); toast('前回の続きから開きました（ステージタブのプリセットで作り直せます）', 3500);
  } else { S = normalizeState(PRESETS.pop.build()); toast('ようこそ！まずはデモ再生を眺めてみてください', 3500); }

  renderTabs(); buildRemote(); buildVJRemote(); commit(); updateViewBtns();

// デバッグ・自動化用の窓口（ブラウザのコンソールから触れる）

  vj: { VJP, VJRT, VJOUT, VJ_HELD, get engine() { return VJ_MAIN; }, trigger: vjTrigger, fade: vjFade, preset: (i) => { vjApplyPreset(VJ_PRESETS[i]); buildVJRemote(); }, open: toggleVJRemote, full: vjEnterFull, exitFull: vjExitFull, openWindow: vjOpenWindow, closeWindow: vjCloseWindow, hold: VJ_HOLD, ui: () => buildVJRemote() } };
